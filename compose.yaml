name: aso
services:
  database:
    image: pgvector/pgvector:pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    environment:
      POSTGRES_DB: aso
      POSTGRES_USER: ${ASO_DB_USER:-aso}
      POSTGRES_PASSWORD: ${ASO_DB_PASSWORD:-aso-local-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d aso"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://127.0.0.1:${ASO_KEYCLOAK_PORT:-8180}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ASO_KEYCLOAK_ADMIN:-idp-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ASO_KEYCLOAK_ADMIN_PASSWORD:-idp-admin-local-only}
    ports:
      - "127.0.0.1:${ASO_KEYCLOAK_PORT:-8180}:8080"
    mem_limit: 1g
    volumes:
      - keycloak:/opt/keycloak/data
      - ./dev/keycloak/aso-dev-realm.json:/opt/keycloak/data/import/aso-dev-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; head -n 1 <&3 | grep -q '200'"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 40
    restart: unless-stopped
volumes:
  database:
  keycloak:
