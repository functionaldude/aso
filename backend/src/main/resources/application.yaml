spring:
  application:
    name: aso
  datasource:
    url: ${ASO_DB_URL:jdbc:postgresql://localhost:5433/aso}
    username: ${ASO_DB_USER:aso}
    password: ${ASO_DB_PASSWORD:aso-local-only}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${ASO_PORT:8080}
  address: ${ASO_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
aso:
  version: '@projectVersion@'
