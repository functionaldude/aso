spring:
  application:
    name: aso
  datasource:
    url: ${ASO_DB_URL:jdbc:postgresql://localhost:5433/aso}
    username: ${ASO_DB_USER:aso}
    password: ${ASO_DB_PASSWORD:aso-local-only}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${ASO_PORT:8080}
  address: ${ASO_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
aso:
  version: '@projectVersion@'
  rate-limit:
    requests: ${ASO_RATE_LIMIT_REQUESTS:600}
    writes: ${ASO_RATE_LIMIT_WRITES:120}
    window: ${ASO_RATE_LIMIT_WINDOW:1m}
  embedding:
    enabled: ${ASO_EMBEDDING_ENABLED:false}
    base-url: ${ASO_EMBEDDING_BASE_URL:http://127.0.0.1:1234/v1}
    allowed-hosts: ${ASO_EMBEDDING_ALLOWED_HOSTS:127.0.0.1,localhost,::1}
    model: ${ASO_EMBEDDING_MODEL:text-embedding-qwen3-embedding-0.6b}
    dimensions: ${ASO_EMBEDDING_DIMENSIONS:1024}
    api-key: ${ASO_EMBEDDING_API_KEY:}
    preparation-version: ${ASO_EMBEDDING_PREPARATION_VERSION:qwen3-retrieval-v1}
    query-prefix: "${ASO_EMBEDDING_QUERY_PREFIX:Instruct: Given a technical problem, retrieve related engineering questions and solutions.\nQuery: }"
    query-suffix: ${ASO_EMBEDDING_QUERY_SUFFIX:}
    document-prefix: ${ASO_EMBEDDING_DOCUMENT_PREFIX:}
    document-suffix: ${ASO_EMBEDDING_DOCUMENT_SUFFIX:}
    max-input-characters: ${ASO_EMBEDDING_MAX_INPUT_CHARACTERS:4000}
    max-query-characters: ${ASO_EMBEDDING_MAX_QUERY_CHARACTERS:1000}
    max-document-chunks: ${ASO_EMBEDDING_MAX_DOCUMENT_CHUNKS:64}
    batch-size: ${ASO_EMBEDDING_BATCH_SIZE:8}
    max-response-bytes: ${ASO_EMBEDDING_MAX_RESPONSE_BYTES:4000000}
    connect-timeout: ${ASO_EMBEDDING_CONNECT_TIMEOUT:300ms}
    request-timeout: ${ASO_EMBEDDING_REQUEST_TIMEOUT:1200ms}
    indexing-timeout: ${ASO_EMBEDDING_INDEXING_TIMEOUT:30s}
    worker-batch-size: ${ASO_EMBEDDING_WORKER_BATCH_SIZE:10}
    retry-delay: ${ASO_EMBEDDING_RETRY_DELAY:5s}
    poll-millis: ${ASO_EMBEDDING_POLL_MILLIS:1000}
    min-similarity: ${ASO_SEARCH_MIN_SIMILARITY:0.45}

  identity:
    # Empty fallbacks let IdentitySettings reject absent values instead of accepting literal placeholders.
    issuer: ${ASO_OIDC_ISSUER:}
    client-id: ${ASO_OIDC_CLIENT_ID:}
    public-url: ${ASO_PUBLIC_URL:}
    mcp-audience: ${ASO_MCP_AUDIENCE:}
    groups-claim: ${ASO_OIDC_GROUPS_CLAIM:}
    member-group: ${ASO_OIDC_MEMBER_GROUP:}
    admin-group: ${ASO_OIDC_ADMIN_GROUP:}
    mcp-token-mode: ${ASO_OIDC_MCP_TOKEN_MODE:jwt}
  agent-setup:
    codex-callback-url: ${ASO_CODEX_CALLBACK_URL:http://127.0.0.1:8766/callback}
