name: ASO checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Docker
        run: docker info
      - name: Unit tests, lint, formatting, and production packaging
        run: ./gradlew --no-daemon check bootJar
      - name: Reproducible offline identity code generation
        run: |
          ./gradlew --no-daemon generateJooq
          git diff --exit-code -- backend/src/generated
      - name: Isolated OIDC fixture smoke tests
        run: ./gradlew --no-daemon oidcSmokeTest
      - name: Independent local service reset checks
        run: ./scripts/keycloak-lifecycle-test.sh
      - name: Database integration tests
        run: ./gradlew --no-daemon integrationTest
      - name: Packaged application browser tests
        run: ./gradlew --no-daemon e2eTest
      - name: Preserve reports and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            backend/build/reports/
            backend/build/test-results/
            backend/build/e2e/
            backend/build/oidc/
            frontend/coverage/
          if-no-files-found: ignore
